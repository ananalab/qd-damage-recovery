# PGA-ME: only the algorithm-specific hyper-parameters (the rest is in common.yaml).
# Values of the official notebook examples/pgame.ipynb (QDax 0.5.0).
algo: pgame
emitter:
  iso_sigma: 0.005
  line_sigma: 0.05
  proportion_mutation_ga: 0.5   # half mutations, half TD3 gradient
td3:
  critic_hidden_layer_size: [256, 256]
  critic_learning_rate: 3.0e-4
  greedy_learning_rate: 3.0e-4
  policy_learning_rate: 1.0e-3
  noise_clip: 0.5
  policy_noise: 0.2
  discount: 0.99
  reward_scaling: 1.0
  transitions_batch_size: 256
  soft_tau_update: 0.005
  replay_buffer_size: 1000000
  num_critic_training_steps: 300
  num_pg_training_steps: 100
  policy_delay: 2

# Per-profile overrides (td3 keys only).
profile_overrides:
  smoke:
    num_critic_training_steps: 5
    num_pg_training_steps: 5
    replay_buffer_size: 10000
