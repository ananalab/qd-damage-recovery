# DCRL-ME: only the algorithm-specific hyper-parameters (the rest is in common.yaml).
# Values of the official notebook examples/dcrlme.ipynb (QDax 0.5.0).
# The notebook defaults to ant_omni; common.yaml sets ant_uni.
algo: dcrlme
emitter:
  iso_sigma: 0.005
  line_sigma: 0.05
  # Split of the shared batch (notebook: 128 / 64 / 64 out of 256).
  ga_fraction: 0.5      # offspring from mutations
  dcrl_fraction: 0.25   # offspring improved by the conditioned critic gradient
  # the rest (0.25): offspring generated by the conditioned actor
dcrl:
  lengthscale: 0.1      # length-scale of the descriptor conditioning
  critic_hidden_layer_size: [256, 256]
  num_critic_training_steps: 3000
  num_pg_training_steps: 150
  transitions_batch_size: 256
  replay_buffer_size: 1000000
  discount: 0.99
  reward_scaling: 1.0
  critic_learning_rate: 3.0e-4
  actor_learning_rate: 3.0e-4
  policy_learning_rate: 5.0e-3
  noise_clip: 0.5
  policy_noise: 0.2
  soft_tau_update: 0.005
  policy_delay: 2

# Per-profile overrides (dcrl keys only).
profile_overrides:
  smoke:
    num_critic_training_steps: 5
    num_pg_training_steps: 5
    replay_buffer_size: 10000
  local:
    # 3000 critic steps per iteration are too slow on CPU for a demo.
    num_critic_training_steps: 300
